<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yuvashree D - Resume</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      background: #0f172a;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .resume-container {
      max-width: 900px;
      margin: auto;
    }

    .resume-title {
      color: #ffffff;
      margin-bottom: 25px;
      font-size: 28px;
    }

    .resume-page {
      width: 100%;
      display: block;
      margin: 0 auto 30px;
      border-radius: 8px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
    }

    .back-btn {
      display: inline-block;
      margin-top: 5px;
      padding: 12px 25px;
      border: 1px solid #60a5fa;
      border-radius: 25px;
      color: #ffffff;
      text-decoration: none;
      transition: 0.3s ease;
    }

    .back-btn:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      body {
        padding: 15px 8px;
      }

      .resume-title {
        font-size: 22px;
      }

      .resume-page {
        margin-bottom: 20px;
      }
    }

    .resume-download {
  margin-top: 25px;
  text-align: center;
}

.download-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #2563eb;
  color: #fff;
  text-decoration: none;
  font-size: 22px;
  box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
  transition: 0.3s ease;
}

.download-btn:hover {
  transform: translateY(-3px);
  background: #1d4ed8;
}
  </style>
</head>

<body>

  <div class="resume-container">

    <h1 class="resume-title">Yuvashree D — Resume</h1>

    <!-- Resume Page 1 -->
    <img
      src="assets/resume/page1.png"
      alt="Yuvashree Resume Page 1"
      class="resume-page">

    <a href="index.html#resume" class="back-btn">
      ← Back to Portfolio
    </a>
<div class="resume-download">
  <a
    href="assets/resume/yuvashree_resume.pdf"
    download="Yuvashree_D_Resume.pdf"
    class="download-btn"
    title="Download Resume">
    📥
  </a>
</div>
  </div>
</body>

</html>
